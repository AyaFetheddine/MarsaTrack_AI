server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour les assets statiques
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Cache long durée pour les assets Vite (hachés dans le nom de fichier)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — toutes les routes React renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend API (le backend MarsaTrack écoute sur le port 3001).
    # Utile si le frontend appelle des chemins relatifs /api ; l'API actuelle
    # utilise une URL absolue http://localhost:3001/api, gérée par le CORS backend.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Images de conteneurs servies par le backend en statique.
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
